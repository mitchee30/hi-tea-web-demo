<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hi Tea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ========== 1. 设计变量：改这里就能换整站配色 ========== */
:root {
  --bg: #F4EEF8;        /* 淡芋泥紫背景 */
  --ink: #2B1D3F;       /* 深芋紫文字 */
  --ink-soft: #6B5C80;
  --brown: #9A5A26;     /* 黑糖棕：主按钮 */
  --pink: #F2A7B8;      /* 草莓粉：点缀 */
  --panel: #FFFFFF;
  --line: #DDD0E8;
  --radius-lg: 28px;
  --radius-sm: 999px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans SC", system-ui, sans-serif;
  line-height: 1.6;
}
h1, h2, .display { font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-weight: 400; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brown); outline-offset: 2px; }

/* 演示标注：必须有，避免被误认为官方网站 */
.demo-ribbon {
  background: var(--ink); color: #fff; text-align: center;
  font-size: 13px; padding: 6px 16px;
}

header.top {
  max-width: 1080px; margin: 0 auto; padding: 20px 16px 0;
  display: flex; justify-content: space-between; align-items: baseline;
}
.logo { font-size: 32px; letter-spacing: 2px; }
.top a { color: var(--ink-soft); text-decoration: none; font-size: 15px; margin-left: 16px; }

main { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

/* ========== 2. 在线调一杯 ========== */
.builder {
  display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px;
  align-items: start; margin-top: 16px;
}
.cup-stage { position: sticky; top: 16px; text-align: center; }
.cup-stage h1 { font-size: clamp(34px, 6vw, 52px); margin: 8px 0 0; line-height: 1.2; }
.cup-stage .sub { color: var(--ink-soft); margin: 4px 0 8px; min-height: 26px; }
#cup { width: min(100%, 300px); height: auto; overflow: visible; }
#liquid, #foam { transition: fill .6s ease, y .6s ease, height .6s ease; }
.piece { transition: transform .9s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
.piece.drop { transform: translateY(-300px); opacity: 0; }
.steam path { fill: none; stroke: var(--ink-soft); stroke-width: 3; stroke-linecap: round; opacity: 0; }
.steam.on path { animation: rise 2.4s ease-in-out infinite; }
.steam.on path:nth-child(2) { animation-delay: .6s; }
.steam.on path:nth-child(3) { animation-delay: 1.2s; }
@keyframes rise { 0% { opacity: 0; transform: translateY(10px); } 40% { opacity: .55; } 100% { opacity: 0; transform: translateY(-24px); } }

.price-bar { display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 4px; flex-wrap: wrap; }
.price { font-family: "ZCOOL KuaiLe"; font-size: 34px; }
.btn {
  border: 0; border-radius: var(--radius-sm); padding: 12px 24px;
  background: var(--brown); color: #fff; font-weight: 700; font-size: 16px;
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }

.options { background: var(--panel); border-radius: var(--radius-lg); padding: 24px; }
.opt-group { margin-bottom: 20px; }
.opt-group:last-child { margin-bottom: 0; }
.opt-group h3 { font-size: 15px; margin: 0 0 8px; color: var(--ink-soft); font-weight: 500; }
.opt-group h3 small { font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 2px solid var(--line); background: #fff; color: var(--ink);
  border-radius: var(--radius-sm); padding: 6px 14px; font-size: 15px;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.chip .extra { font-size: 12px; opacity: .7; }

/* ========== 3. 今天喝什么 ========== */
.spin-section {
  margin-top: 72px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center;
}
.spin-section h2 { font-size: clamp(30px, 5vw, 44px); margin: 0; line-height: 1.2; }
.weather { color: var(--ink-soft); margin: 8px 0 16px; min-height: 26px; }
.weather select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; background: #fff; color: var(--ink); }
.wheel-wrap { position: relative; width: min(100%, 380px); margin: 0 auto; }
#wheel { width: 100%; height: auto; display: block; }
#wheel-rot { transition: transform 4.2s cubic-bezier(.17,.84,.25,1); transform-origin: 200px 200px; }
.pointer {
  position: absolute; left: 50%; top: -6px; transform: translateX(-50%); z-index: 1;
  width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-top: 26px solid var(--ink);
}
.result { margin-top: 16px; background: var(--panel); border-radius: 20px; padding: 16px 20px; display: none; }
.result.show { display: block; }
.result strong { font-family: "ZCOOL KuaiLe"; font-size: 26px; font-weight: 400; display: block; }
.result p { margin: 4px 0 12px; color: var(--ink-soft); }

/* ========== 4. 菜单 ========== */
.menu { margin-top: 72px; }
.menu h2 { font-size: clamp(30px, 5vw, 44px); margin: 0 0 16px; }
.menu-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 32px; }
.menu-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.menu-list .name { font-weight: 700; }
.menu-list .en { display: block; font-size: 13px; color: var(--ink-soft); font-weight: 400; }
.menu-list button { background: none; border: 0; color: var(--brown); font-weight: 700; padding: 4px 0; white-space: nowrap; }

footer { border-top: 1px solid var(--line); margin-top: 64px; padding: 24px 16px; text-align: center; color: var(--ink-soft); font-size: 14px; }

dialog { border: 0; border-radius: var(--radius-lg); padding: 28px; max-width: 360px; width: calc(100% - 32px); color: var(--ink); }
dialog::backdrop { background: rgba(43,29,63,.45); }
dialog h2 { margin: 0 0 8px; font-size: 30px; }
.pickup { font-family: "ZCOOL KuaiLe"; font-size: 56px; color: var(--brown); line-height: 1.1; margin: 8px 0; }
dialog .note { font-size: 13px; color: var(--ink-soft); }

/* 手机布局 */
@media (max-width: 760px) {
  .builder, .spin-section { grid-template-columns: 1fr; }
  .cup-stage { position: static; }
  .options { padding: 20px 16px; }
  .top nav { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="demo-ribbon">Hi Tea 是一家虚构的奶茶店，用来演示网站功能，价格仅为示例</div>

<header class="top">
  <div class="logo display">Hi Tea</div>
  <nav><a href="#builder">调一杯</a><a href="#spin">今天喝什么</a><a href="#menu">菜单</a></nav>
</header>

<main>
  <!-- ========== 在线调一杯 ========== -->
  <section class="builder" id="builder">
    <div class="cup-stage">
      <h1>调一杯你的</h1>
      <p class="sub" id="summary"></p>

      <svg id="cup" viewBox="0 0 240 360" role="img" aria-label="你调的饮品预览">
        <defs>
          <!-- 杯子形状，同时用作液体的裁剪区域 -->
          <clipPath id="cupClip">
            <path d="M32 70 L208 70 L188 318 Q186 332 172 332 L68 332 Q54 332 52 318 Z"/>
          </clipPath>
        </defs>
        <g class="steam" id="steam">
          <path d="M95 40 q-8 -10 0 -20 q8 -10 0 -20"/>
          <path d="M120 40 q-8 -10 0 -20 q8 -10 0 -20"/>
          <path d="M145 40 q-8 -10 0 -20 q8 -10 0 -20"/>
        </g>
        <!-- 吸管 -->
        <rect x="138" y="-10" width="16" height="240" rx="6" fill="#F2A7B8" transform="rotate(12 146 110)"/>
        <g clip-path="url(#cupClip)">
          <rect x="0" y="70" width="240" height="270" fill="#F8F4FA"/>
          <rect id="liquid" x="0" y="96" width="240" height="250" fill="#B07A52"/>
          <g id="pieces"></g>
          <rect id="foam" x="0" y="76" width="240" height="0" fill="#FFF3D6"/>
        </g>
        <!-- 杯子外框和杯盖 -->
        <path d="M32 70 L208 70 L188 318 Q186 332 172 332 L68 332 Q54 332 52 318 Z" fill="none" stroke="#2B1D3F" stroke-width="4" stroke-linejoin="round"/>
        <rect x="24" y="60" width="192" height="14" rx="7" fill="#2B1D3F"/>
      </svg>

      <div class="price-bar">
        <span class="price" id="price">$5.50</span>
        <button class="btn" id="orderBtn">下单，到店自取</button>
      </div>
    </div>

    <div class="options">
      <div class="opt-group"><h3>茶底</h3><div class="chips" id="opt-tea"></div></div>
      <div class="opt-group"><h3>奶</h3><div class="chips" id="opt-milk"></div></div>
      <div class="opt-group"><h3>甜度</h3><div class="chips" id="opt-sweet"></div></div>
      <div class="opt-group"><h3>冰量</h3><div class="chips" id="opt-ice"></div></div>
      <div class="opt-group"><h3>杯型</h3><div class="chips" id="opt-size"></div></div>
      <div class="opt-group"><h3>小料 <small>最多选 3 种</small></h3><div class="chips" id="opt-top"></div></div>
    </div>
  </section>

  <!-- ========== 今天喝什么 ========== -->
  <section class="spin-section" id="spin">
    <div>
      <h2>今天喝什么？</h2>
      <p class="weather" id="weather">正在看 Kitchener 今天的天气…</p>
      <div class="opt-group">
        <h3>现在的心情</h3>
        <div class="chips" id="opt-mood"></div>
      </div>
      <button class="btn" id="spinBtn">帮我选一杯</button>
      <div class="result" id="result" aria-live="polite">
        <strong id="resultName"></strong>
        <p id="resultWhy"></p>
        <button class="btn ghost" id="useResult">就调这杯</button>
      </div>
    </div>
    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <svg id="wheel" viewBox="0 0 400 400" aria-hidden="true"><g id="wheel-rot"></g></svg>
    </div>
  </section>

  <!-- ========== 菜单 ========== -->
  <section class="menu" id="menu">
    <h2>招牌菜单</h2>
    <ul class="menu-list" id="menuList"></ul>
  </section>
</main>

<footer>
  Hi Tea 是虚构品牌，仅用于演示<br>
  网站设计与开发：Wenbo Zhi
</footer>

<dialog id="orderDialog">
  <h2>下单成功</h2>
  <p id="orderText"></p>
  <p>你的取餐号</p>
  <div class="pickup" id="pickupNo">042</div>
  <p class="note">这是演示，不会真的下单。正式版可以接 Square 或 Stripe 收款，订单直接发到店里的平板。</p>
  <button class="btn" id="closeDialog">知道了</button>
</dialog>

<script>
/* =========================================================
   第一部分：数据
   所有选项都写成数组。以后换成真实菜单，只改这里就行。
   ========================================================= */
const TEAS = [
  { id: 'black',   name: '红茶',     color: '#7A3B12', price: 5.50 },
  { id: 'oolong',  name: '乌龙',     color: '#A8641F', price: 5.80 },
  { id: 'jasmine', name: '茉莉绿茶', color: '#C2A74A', price: 5.50 },
  { id: 'matcha',  name: '抹茶',     color: '#6E9A5B', price: 6.50 },
  { id: 'taro',    name: '芋头',     color: '#9B7FC4', price: 6.50 },
  { id: 'thai',    name: '泰式茶',   color: '#E0823A', price: 5.80 },
  { id: 'fruit',   name: '水果茶',   color: '#E8566E', price: 6.50 },
];
const MILKS = [
  { id: 'none', name: '不加奶', mix: 0,    price: 0 },
  { id: 'milk', name: '牛奶',   mix: 0.45, price: 0 },
  { id: 'oat',  name: '燕麦奶', mix: 0.40, price: 0.50 },
];
const SWEETS = [
  { id: 0, name: '无糖' }, { id: 30, name: '三分糖' }, { id: 50, name: '五分糖' },
  { id: 70, name: '七分糖' }, { id: 100, name: '全糖' },
];
const ICES = [
  { id: 'hot',    name: '热的',   cubes: 0 },
  { id: 'noice',  name: '去冰',   cubes: 0 },
  { id: 'less',   name: '少冰',   cubes: 2 },
  { id: 'normal', name: '正常冰', cubes: 4 },
];
const SIZES = [
  { id: 'M', name: '中杯', price: 0 },
  { id: 'L', name: '大杯', price: 0.80 },
];
const TOPPINGS = [
  { id: 'pearl',    name: '珍珠',     color: '#2A1A12', price: 0.75 },
  { id: 'brown',    name: '黑糖珍珠', color: '#5B2E10', price: 0.90 },
  { id: 'coco',     name: '椰果',     color: '#F3EFE4', price: 0.75 },
  { id: 'taroball', name: '芋圆',     color: '#B49AD6', price: 1.00 },
  { id: 'pudding',  name: '布丁',     color: '#F2C14E', price: 1.00 },
  { id: 'cheese',   name: '芝士奶盖', color: '#FFF3D6', price: 1.25 },
];

/* 招牌饮品：每一杯都是"调一杯"里的一个预设组合。
   tags 用来给"今天喝什么"打分。 */
const DRINKS = [
  { name: '黑糖珍珠鲜奶', en: 'Brown Sugar Pearls Milk', short: '黑糖珍珠',
    preset: { tea: 'black', milk: 'milk', sweet: 70, ice: 'less', tops: ['brown'] }, tags: ['sweet', 'warmok', 'cozy'] },
  { name: '经典珍珠奶茶', en: 'Classic Bubble Milk Tea', short: '珍珠奶茶',
    preset: { tea: 'black', milk: 'milk', sweet: 50, ice: 'normal', tops: ['pearl'] }, tags: ['caffeine', 'warmok', 'classic'] },
  { name: '芋泥波波', en: 'Taro Paste Boba', short: '芋泥波波',
    preset: { tea: 'taro', milk: 'milk', sweet: 50, ice: 'less', tops: ['taroball', 'pearl'] }, tags: ['sweet', 'warmok', 'cozy'] },
  { name: '草莓椰椰', en: 'Strawberry Coconut', short: '草莓椰椰',
    preset: { tea: 'fruit', milk: 'none', sweet: 50, ice: 'normal', tops: ['coco'] }, tags: ['fruity', 'fresh'] },
  { name: '抹茶椰椰', en: 'Matcha Coconut', short: '抹茶椰椰',
    preset: { tea: 'matcha', milk: 'oat', sweet: 30, ice: 'normal', tops: ['coco'] }, tags: ['caffeine', 'fresh'] },
  { name: '泰式珍珠奶茶', en: 'Thai Milk Tea with Pearls', short: '泰式奶茶',
    preset: { tea: 'thai', milk: 'milk', sweet: 70, ice: 'normal', tops: ['pearl'] }, tags: ['caffeine', 'sweet'] },
  { name: '茉莉奶盖绿茶', en: 'Jasmine Cheese Foam', short: '茉莉奶盖',
    preset: { tea: 'jasmine', milk: 'none', sweet: 30, ice: 'less', tops: ['cheese'] }, tags: ['caffeine', 'fresh'] },
  { name: '乌龙布丁奶茶', en: 'Oolong Pudding Milk Tea', short: '乌龙布丁',
    preset: { tea: 'oolong', milk: 'milk', sweet: 50, ice: 'less', tops: ['pudding'] }, tags: ['caffeine', 'warmok', 'classic'] },
];

/* =========================================================
   第二部分：状态
   页面上所有东西都由这一个对象决定。改状态，再调用 render()。
   ========================================================= */
const state = { tea: 'black', milk: 'milk', sweet: 50, ice: 'normal', size: 'M', tops: [] };
const mood = { current: 'any' };
const weather = { kind: null, temp: null };   // kind: cold / mild / hot / rain

const byId = (arr, id) => arr.find(x => x.id === id);

/* 把两个颜色按比例混合，用来算"茶 + 奶"之后的颜色 */
function mix(hexA, hexB, t) {
  const a = hexA.match(/\w\w/g).map(h => parseInt(h, 16));
  const b = hexB.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

function calcPrice() {
  let p = byId(TEAS, state.tea).price + byId(MILKS, state.milk).price + byId(SIZES, state.size).price;
  state.tops.forEach(t => { p += byId(TOPPINGS, t).price; });
  return p;
}

/* =========================================================
   第三部分：生成选项按钮
   一个通用函数，给每组选项生成"小药丸"按钮。
   target 是要修改的状态对象（state 或 mood），key 是字段名。
   ========================================================= */
function makeChips(containerId, items, target, key, { multi = false, max = 99, showPrice = false, dot = false } = {}) {
  const box = document.getElementById(containerId);
  box.innerHTML = '';
  items.forEach(item => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.id = item.id;
    if (dot) b.innerHTML = `<span class="dot" style="background:${item.color}"></span>`;
    b.insertAdjacentHTML('beforeend', item.name);
    if (showPrice && item.price) b.insertAdjacentHTML('beforeend', ` <span class="extra">+$${item.price.toFixed(2)}</span>`);
    b.addEventListener('click', () => {
      if (multi) {
        const list = target[key];
        const i = list.indexOf(item.id);
        if (i >= 0) list.splice(i, 1);
        else if (list.length < max) list.push(item.id);
      } else {
        target[key] = item.id;
      }
      syncChips(containerId, target, key);
      if (target === state) render();
    });
    box.appendChild(b);
  });
  syncChips(containerId, target, key);
}

function syncChips(containerId, target, key) {
  document.querySelectorAll(`#${containerId} .chip`).forEach(b => {
    const val = target[key];
    const on = Array.isArray(val) ? val.includes(b.dataset.id) : String(val) === b.dataset.id;
    b.setAttribute('aria-pressed', on);
  });
}

/* =========================================================
   第四部分：画杯子
   杯子是一个梯形：顶部 y=70 半宽 88，底部 y=318 半宽 68。
   halfWidth(y) 算出某个高度上杯子有多宽，保证小料不会掉到杯子外面。
   ========================================================= */
const SVGNS = 'http://www.w3.org/2000/svg';
const halfWidth = y => 88 - (y - 70) * (20 / 248);
const rand = (a, b) => a + Math.random() * (b - a);
const rendered = {};   // 记录已经画在杯子里的小料，只给新加的播放掉落动画

function placeInCup(yMin, yMax, r) {
  const y = rand(yMin, yMax);
  const hw = halfWidth(y) - r - 6;
  return { x: 120 + rand(-hw, hw), y };
}

function svgEl(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function makeToppingGroup(id) {
  const t = byId(TOPPINGS, id);
  const g = document.createElementNS(SVGNS, 'g');
  if (id === 'cheese') return g;  // 奶盖单独用 #foam 画
  const n = { pearl: 22, brown: 22, coco: 12, taroball: 9, pudding: 1 }[id];
  for (let i = 0; i < n; i++) {
    let el;
    if (id === 'pearl' || id === 'brown') {
      const p = placeInCup(286, 318, 8);
      el = svgEl('circle', { cx: p.x, cy: p.y, r: 8 });
    } else if (id === 'taroball') {
      const p = placeInCup(270, 314, 10);
      el = svgEl('ellipse', { cx: p.x, cy: p.y, rx: 11, ry: 9 });
    } else if (id === 'coco') {
      const p = placeInCup(170, 270, 9);
      el = svgEl('rect', { x: p.x - 7, y: p.y - 7, width: 14, height: 14, rx: 3, opacity: .85 });
    } else {
      el = svgEl('rect', { x: 82, y: 262, width: 70, height: 46, rx: 10 });
    }
    el.setAttribute('fill', t.color);
    el.classList.add('piece', 'drop');
    el.style.transitionDelay = (i * 0.035) + 's';  // 一颗一颗错开掉下去
    g.appendChild(el);
  }
  return g;
}

function drawIce() {
  const old = document.getElementById('iceGroup');
  if (old) old.remove();
  const g = svgEl('g', { id: 'iceGroup' });
  const cubes = byId(ICES, state.ice).cubes;
  const spots = [[80, 112, -12], [130, 106, 8], [160, 130, -6], [100, 140, 14]];
  for (let i = 0; i < cubes; i++) {
    const [x, y, rot] = spots[i];
    g.appendChild(svgEl('rect', {
      x, y, width: 30, height: 30, rx: 6, fill: '#FFFFFF', opacity: .55,
      transform: `rotate(${rot} ${x + 15} ${y + 15})`,
    }));
  }
  document.getElementById('pieces').appendChild(g);
}

function drawCup() {
  const tea = byId(TEAS, state.tea);
  const milk = byId(MILKS, state.milk);
  // 茶色 + 奶白；糖越多颜色越暖一点点
  let color = mix(tea.color, '#F7EDE2', milk.mix);
  color = mix(color, '#C27A3A', state.sweet / 1000);
  const liquid = document.getElementById('liquid');
  liquid.setAttribute('fill', color);

  // 奶盖：有就在顶部画一层奶油色，液面相应往下
  const hasCheese = state.tops.includes('cheese');
  document.getElementById('foam').setAttribute('height', hasCheese ? 34 : 0);
  liquid.setAttribute('y', hasCheese ? 108 : 96);

  // 热饮冒热气
  document.getElementById('steam').classList.toggle('on', state.ice === 'hot');

  // 小料：新加的画出来并播放掉落动画，取消的删掉
  const piecesBox = document.getElementById('pieces');
  TOPPINGS.forEach(t => {
    const want = state.tops.includes(t.id);
    if (want && !rendered[t.id]) {
      const g = makeToppingGroup(t.id);
      piecesBox.prepend(g);
      rendered[t.id] = g;
      // 等浏览器先画出"掉落前"的位置，下一帧再移除 drop，触发动画
      requestAnimationFrame(() => requestAnimationFrame(() => {
        g.querySelectorAll('.piece').forEach(p => p.classList.remove('drop'));
      }));
    } else if (!want && rendered[t.id]) {
      rendered[t.id].remove();
      delete rendered[t.id];
    }
  });
  drawIce();
}

/* =========================================================
   第五部分：render() 把状态同步到整个页面
   ========================================================= */
function render() {
  [['opt-tea', 'tea'], ['opt-milk', 'milk'], ['opt-sweet', 'sweet'], ['opt-ice', 'ice'], ['opt-size', 'size'], ['opt-top', 'tops']]
    .forEach(([c, k]) => syncChips(c, state, k));
  drawCup();
  document.getElementById('price').textContent = '$' + calcPrice().toFixed(2);
  const parts = [
    byId(TEAS, state.tea).name, byId(MILKS, state.milk).name,
    byId(SWEETS, state.sweet).name, byId(ICES, state.ice).name,
    ...state.tops.map(t => byId(TOPPINGS, t).name),
  ];
  document.getElementById('summary').textContent = parts.join('，');
}

/* 下单（演示） */
document.getElementById('orderBtn').addEventListener('click', () => {
  document.getElementById('orderText').textContent =
    `${byId(SIZES, state.size).name}，${document.getElementById('summary').textContent}，共 ${document.getElementById('price').textContent}`;
  document.getElementById('pickupNo').textContent = String(Math.floor(rand(1, 999))).padStart(3, '0');
  document.getElementById('orderDialog').showModal();
});
document.getElementById('closeDialog').addEventListener('click', () => document.getElementById('orderDialog').close());

/* 把某个招牌饮品的配方载入"调一杯" */
function loadPreset(drink) {
  Object.assign(state, { ...drink.preset, tops: [...drink.preset.tops] });
  render();
  document.getElementById('builder').scrollIntoView({ behavior: 'smooth' });
}

/* =========================================================
   第六部分：今天喝什么
   1. 用 Open-Meteo（免费、不用 API key）拿 Kitchener 当前天气
   2. 天气 + 心情 给每杯饮品打分，选出最高分
   3. 转盘转到那一格
   ========================================================= */
const MOODS = [
  { id: 'wake',  name: '要提神' },
  { id: 'sweet', name: '想吃甜的' },
  { id: 'fresh', name: '想清爽一点' },
  { id: 'any',   name: '随便，你定' },
];
const WEATHER_TEXT = { cold: '有点冷', mild: '不冷不热', hot: '挺热的', rain: '在下雨' };

async function loadWeather() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 5000);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=43.45&longitude=-80.49&current=temperature_2m,precipitation,weather_code';
    const res = await fetch(url, { signal: ctrl.signal });
    const data = await res.json();
    const t = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const raining = data.current.precipitation > 0 || (code >= 51 && code <= 82);
    weather.temp = t;
    weather.kind = raining ? 'rain' : t < 10 ? 'cold' : t >= 24 ? 'hot' : 'mild';
    renderWeather(`Kitchener 现在 ${t}°C，${WEATHER_TEXT[weather.kind]}。不对的话可以改：`);
  } catch (e) {
    // 拿不到天气时，让用户自己选，页面照样能用
    weather.kind = 'mild';
    renderWeather('暂时拿不到天气，你可以手动选：');
  }
}
function renderWeather(prefix) {
  const el = document.getElementById('weather');
  el.textContent = prefix;
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', '今天的天气');
  Object.entries(WEATHER_TEXT).forEach(([k, v]) => sel.add(new Option(v, k, false, k === weather.kind)));
  sel.addEventListener('change', e => { weather.kind = e.target.value; });
  el.appendChild(sel);
}

function scoreDrink(d) {
  let s = Math.random() * 1.5;  // 一点随机，同样条件也不会每次都一样
  if (weather.kind === 'cold' || weather.kind === 'rain') { if (d.tags.includes('warmok')) s += 3; if (d.tags.includes('cozy')) s += 2; }
  if (weather.kind === 'hot') { if (d.tags.includes('fruity')) s += 3; if (d.tags.includes('fresh')) s += 2; }
  if (mood.current === 'wake' && d.tags.includes('caffeine')) s += 3;
  if (mood.current === 'sweet' && d.tags.includes('sweet')) s += 3;
  if (mood.current === 'fresh' && (d.tags.includes('fresh') || d.tags.includes('fruity'))) s += 3;
  if (mood.current === 'any') s += Math.random() * 3;
  return s;
}

function reasonFor(makeHot) {
  const w = {
    cold: '外面有点冷，来一杯热的暖暖手。',
    rain: '下雨天，适合捧着一杯热饮慢慢喝。',
    hot: '天这么热，喝点冰的清爽一下。',
    mild: '今天天气舒服，正适合来一杯。',
  }[weather.kind];
  const m = { wake: '茶底带咖啡因，下午不犯困。', sweet: '甜度刚好，治愈一下。', fresh: '口感清爽，不腻。', any: '这杯是店里的人气款。' }[mood.current];
  return w + m + (makeHot ? '已经帮你改成热的了。' : '');
}

/* 画转盘：8 格，每格 45 度 */
const SEG_COLORS = ['#9B7FC4', '#F2A7B8', '#9A5A26', '#C9B8DD', '#6E9A5B', '#F7D5DC', '#2B1D3F', '#E0823A'];
const DARK_SEGS = ['#9A5A26', '#6E9A5B', '#2B1D3F'];
function drawWheel() {
  const g = document.getElementById('wheel-rot');
  const cx = 200, cy = 200, r = 190;
  DRINKS.forEach((d, i) => {
    const a0 = (i * 45 - 90) * Math.PI / 180, a1 = ((i + 1) * 45 - 90) * Math.PI / 180;
    g.appendChild(svgEl('path', {
      d: `M${cx} ${cy} L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A${r} ${r} 0 0 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)} Z`,
      fill: SEG_COLORS[i], stroke: '#fff', 'stroke-width': 3,
    }));
    const text = svgEl('text', {
      x: cx, y: cy - 125, 'text-anchor': 'middle', 'font-family': 'ZCOOL KuaiLe, sans-serif', 'font-size': 22,
      fill: DARK_SEGS.includes(SEG_COLORS[i]) ? '#fff' : '#2B1D3F',
      transform: `rotate(${i * 45 + 22.5} ${cx} ${cy})`,
    });
    text.textContent = d.short;
    g.appendChild(text);
  });
  g.appendChild(svgEl('circle', { cx, cy, r: 26, fill: '#fff' }));
}

let wheelAngle = 0;
let picked = null;
document.getElementById('spinBtn').addEventListener('click', () => {
  // 1. 打分选饮品
  const ranked = DRINKS.map((d, i) => ({ d, i, s: scoreDrink(d) })).sort((a, b) => b.s - a.s);
  const { d, i } = ranked[0];
  const makeHot = (weather.kind === 'cold' || weather.kind === 'rain') && d.tags.includes('warmok');
  picked = { ...d, preset: { ...d.preset, ice: makeHot ? 'hot' : d.preset.ice } };

  // 2. 算转盘要转多少度：让第 i 格的中心转到正上方的指针下面，再多转 5 圈
  const target = 360 - (i * 45 + 22.5);
  const current = ((wheelAngle % 360) + 360) % 360;
  wheelAngle += 360 * 5 + ((target - current + 360) % 360);
  document.getElementById('wheel-rot').style.transform = `rotate(${wheelAngle}deg)`;

  // 3. 转完再显示结果
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  document.getElementById('result').classList.remove('show');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => {
    document.getElementById('resultName').textContent = d.name;
    document.getElementById('resultWhy').textContent = reasonFor(makeHot);
    document.getElementById('result').classList.add('show');
    btn.disabled = false;
    btn.textContent = '再选一次';
  }, reduce ? 50 : 4300);
});
document.getElementById('useResult').addEventListener('click', () => picked && loadPreset(picked));

/* =========================================================
   第七部分：启动
   ========================================================= */
makeChips('opt-tea', TEAS, state, 'tea', { dot: true });
makeChips('opt-milk', MILKS, state, 'milk', { showPrice: true });
makeChips('opt-sweet', SWEETS, state, 'sweet');
makeChips('opt-ice', ICES, state, 'ice');
makeChips('opt-size', SIZES, state, 'size', { showPrice: true });
makeChips('opt-top', TOPPINGS, state, 'tops', { multi: true, max: 3, showPrice: true, dot: true });
makeChips('opt-mood', MOODS, mood, 'current');

const menu = document.getElementById('menuList');
DRINKS.forEach(d => {
  const li = document.createElement('li');
  li.innerHTML = `<span class="name">${d.name}<span class="en">${d.en}</span></span>`;
  const b = document.createElement('button');
  b.textContent = '调这杯';
  b.onclick = () => loadPreset(d);
  li.appendChild(b);
  menu.appendChild(li);
});

drawWheel();
render();
loadWeather();
</script>
